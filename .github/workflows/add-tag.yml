name: add tag

on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'input tag (leave empty to auto-increment latest tag)'
        required: false

jobs:
  add-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0  # 获取所有标签和历史记录

      - name: Add tag
        run: |
          git config --global user.name 'wolfsilver'
          git config --global user.email '2452450+wolfsilver@users.noreply.github.com'

          if [ -z "${{ inputs.tag-name }}" ]; then
            # 如果tag-name为空，获取最新tag并增加版本号
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Latest tag: $LATEST_TAG"

            # 提取前缀(如 "v")和版本号部分
            PREFIX=$(echo $LATEST_TAG | sed -E 's/[0-9].*//')
            VERSION=$(echo $LATEST_TAG | sed -E 's/^[^0-9]*//')

            # 分割版本号
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3 | cut -d+ -f1)  # 处理可能存在的元数据（如 1.2.3+meta）

            # 将PATCH版本号加1
            NEW_PATCH=$((PATCH + 1))

            # 组合新tag
            NEW_TAG="${PREFIX}${MAJOR}.${MINOR}.${NEW_PATCH}"

            echo "Generated new tag: $NEW_TAG"
            TAG_TO_PUSH=$NEW_TAG
          else
            TAG_TO_PUSH="${{ inputs.tag-name }}"
            echo "Using provided tag: $TAG_TO_PUSH"
          fi

          git tag $TAG_TO_PUSH
          git push origin $TAG_TO_PUSH
